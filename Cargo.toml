[package]
name = "planet-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytemuck = "1.25.0"
glam = "0.33.1"
noise = "0.9.0"
png = "0.18.1"
pollster = "0.4.0"
rand = "0.10.1"
rodio = "0.22.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wgpu = "29.0.3"
winit = "0.30.13"

[dev-dependencies]
png = "0.18.1"

# Windows only: embed the app icon (assets/AppIcon.ico) into the .exe at build
# time. Target-gated so it isn't pulled in on macOS.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
